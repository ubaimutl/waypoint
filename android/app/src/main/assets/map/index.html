<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https://tile.openstreetmap.org; connect-src 'none'"><style>__LEAFLET_CSS__
html,body,#map{height:100%;width:100%;margin:0;background:#e9eeea;font-family:system-ui,sans-serif}.leaflet-container{background:#e9eeea}.leaflet-control-attribution{font-size:10px!important;background:#fffffff0!important;color:#52645b;padding:3px 7px!important;border-radius:6px;margin:8px!important}.leaflet-control-attribution a{color:#315d48}.phone-pin{display:flex;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;border:3px solid #fff;border-radius:50%;background:#758b80;color:white;box-shadow:0 2px 12px #233d322e}.phone-pin.selected{background:#285d49;box-shadow:0 0 0 7px #285d4922,0 2px 12px #233d3233}.phone-pin svg{width:18px;height:24px}.leaflet-tooltip{border:0;border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 2px 12px #233d3215;color:#23372e}#tile-error{position:absolute;top:80px;left:20px;right:20px;background:#fffaf1;padding:12px 16px;border-radius:12px;color:#795f32;font-size:13px;z-index:800;display:none} .leaflet-control-zoom{display:none}
body.dark,body.dark .leaflet-container{background:#25313d}body.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.7) saturate(.65)}body.dark .leaflet-control-attribution{background:#182127f5!important;color:#b5c3ce}body.dark .leaflet-control-attribution a{color:#9bd6b3}body.dark .leaflet-tooltip{background:#202c36;color:#eff5fa}body.dark #tile-error{background:#292c32;color:#efd7ac}</style></head><body><div id="map" role="img" aria-label="Locations of your devices"></div><div id="tile-error" role="status">Map tiles could not load. Your saved device locations are still shown. Check your internet connection.</div><script>__LEAFLET_JS__</script><script>
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([20,0],2);map.attributionControl.setPrefix(false);map.attributionControl.setPosition('bottomleft');
const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);
map.on('moveend',()=>console.log('waypoint-map-settled'));tiles.on('load',()=>console.log('waypoint-map-settled'));
let errors=0;tiles.on('tileerror',()=>{if(++errors>=3)document.querySelector('#tile-error').style.display='block'});tiles.on('load',()=>{if(!errors)document.querySelector('#tile-error').style.display='none'});tiles.on('loading',()=>{errors=0});
let layer=L.layerGroup().addTo(map),state={},lastSelected=null,hasCentered=false,pendingFocus=false,followFrom=null;
const phone='<svg viewBox="0 0 20 28" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="1.5" width="14" height="25" rx="3"/><path d="M7 5h6M8 23h4"/></svg>';
function valid(report){return report&&Number.isFinite(report.lat)&&Number.isFinite(report.lng)&&Math.abs(report.lat)<=90&&Math.abs(report.lng)<=180}
function center(){const device=(state.devices||[]).find(d=>d.id===state.selected);if(valid(device?.report)){const point=L.latLng(device.report.lat,device.report.lng);map.setView(point,16,{animate:false});map.panBy([0,(state.bottom||280)/2-30],{animate:false});hasCentered=true}}
function all(){const points=(state.devices||[]).filter(d=>valid(d.report)).map(d=>[d.report.lat,d.report.lng]);if(points.length)map.fitBounds(L.latLngBounds(points),{maxZoom:16,paddingTopLeft:[40,110],paddingBottomRight:[40,(state.bottom||280)+24],animate:false})}
window.waypoint={update(next){state=next;document.body.classList.toggle('dark',!!next.dark);document.querySelector('.leaflet-bottom.leaflet-left').style.bottom=((state.bottom||280)+8)+'px';layer.clearLayers();const chosen=next.selected;let selectedReport=null;
 for(const device of next.devices||[]){if(!valid(device.report))continue;const report=device.report;const selected=device.id===chosen;if(selected)selectedReport=report;
 const marker=L.marker([report.lat,report.lng],{icon:L.divIcon({html:'<div class="phone-pin'+(selected?' selected':'')+'">'+phone+'</div>',className:'',iconSize:[44,44],iconAnchor:[22,22]}),zIndexOffset:selected?1000:0}).addTo(layer);
 const label=document.createElement('span');label.textContent=device.name;marker.bindTooltip(label,{direction:'top',offset:[0,-23]});
 marker.on('click',()=>{location.href='https://waypoint.invalid/select?device='+encodeURIComponent(device.id)});
 if(selected&&Number.isFinite(report.accuracy))L.circle([report.lat,report.lng],{radius:report.accuracy,color:'#285d49',weight:1,fillColor:'#285d49',fillOpacity:.08,interactive:false}).addTo(layer);
 }
 if((chosen!==lastSelected||!hasCentered||(pendingFocus&&selectedReport?.recorded_at!==followFrom))&&selectedReport){center();pendingFocus=false}lastSelected=chosen;
},center,all,follow(){pendingFocus=true;followFrom=(state.devices||[]).find(d=>d.id===state.selected)?.report?.recorded_at||null},resize(bottom){state.bottom=bottom;document.querySelector('.leaflet-bottom.leaflet-left').style.bottom=(bottom+8)+'px';map.invalidateSize()}};
</script></body></html>
