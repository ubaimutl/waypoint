name: Publish Docker image
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tag=process.env.RELEASE_TAG;
          if(!/^v\d+\.\d+\.\d+$/.test(tag))throw new Error('Use a vMAJOR.MINOR.PATCH release tag');
          const version=tag.slice(1);
          if(JSON.parse(fs.readFileSync('server/package.json')).version!==version)throw new Error('Server version differs from tag');
          if(!fs.readFileSync('android/app/build.gradle.kts','utf8').includes(`versionName = "${version}"`))throw new Error('Android version differs from tag');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${version}\nimage=ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}:${version}\n`);
          JS
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm test
        working-directory: server
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64 and ARM64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.image }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Smoke test both published platforms
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          set -euo pipefail
          export ADMIN_PASSWORD_HASH="$(node --input-type=module -e 'import{randomBytes,scryptSync}from"node:crypto";const salt=randomBytes(16).toString("hex");console.log(salt+":"+scryptSync(randomBytes(32),salt,64).toString("hex"))')"
          trap 'docker rm -f waypoint-release-smoke >/dev/null 2>&1 || true' EXIT
          for platform in linux/amd64 linux/arm64; do
            docker run --pull=always --platform "$platform" --detach --name waypoint-release-smoke \
              --env APP_ORIGIN=https://locator.example.com --env ADMIN_PASSWORD_HASH "$IMAGE"
            ready=false
            for attempt in $(seq 1 30); do
              if docker exec waypoint-release-smoke node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then ready=true; break; fi
              sleep 2
            done
            test "$ready" = true
            test "$(docker exec waypoint-release-smoke id -u)" = 1000
            docker exec waypoint-release-smoke node --input-type=module -e "const r=await fetch('http://127.0.0.1:3000/api/session');const s=await r.json();if(!r.ok||s.authenticated||s.demo)process.exit(1)"
            docker rm -f waypoint-release-smoke
          done
      - name: Record published digest
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: `%s`\n\nDigest: `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
